name: Publish to npm

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openclaw/**'
      - 'docs/**'
      - 'packages/cli/**'
      - 'scripts/prepare-cli-package.mjs'
      - '.github/workflows/publish.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        # npm's OIDC trusted publishing requires npm CLI >= 11.5.1 *and*
        # Node >= 22.14.0 (https://docs.npmjs.com/trusted-publishers/).
        # Node 20 satisfies npm 11.18.0's own package engines range
        # (^20.17.0 || >=22.9.0) but is below npm's separate, stricter
        # trusted-publishing runtime requirement, so this job must run on
        # Node 22. Pinned to 22.23.1: the current Node 22 "Jod" LTS release
        # (still in Maintenance LTS through 2027-04-30), verified present in
        # actions/setup-node's version manifest and comfortably above the
        # 22.14.0 minimum.
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing requires npm >= 11.5.1)
        run: |
          # Pin to npm 11.18.0: the latest 11.x release compatible with the
          # Node 22.23.1 runtime above (npm's own engines field requires
          # node ^20.17.0 || >=22.9.0). `npm@latest` resolves to npm 12.x,
          # which requires Node >=22.22.2/^24.15.0/>=26.0.0 and previously
          # broke this job on Node 20 (see failed run 29392811746). Even
          # with npm 11.18.0, npm's trusted-publishing/OIDC feature itself
          # additionally requires Node >= 22.14.0
          # (https://docs.npmjs.com/trusted-publishers/), which is why the
          # Setup Node.js step above was moved from Node 20 to Node 22.23.1.
          npm install -g npm@11.18.0
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"

      - name: Install dependencies
        run: npm ci

      - name: Check standalone CLI version consistency
        run: npm run check:cli-version
        env:
          CLI_VERSION_BASE_SHA: ${{ github.event.before || 'origin/main' }}
      
      - name: Build
        run: npm run build
      
      - name: Check package versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          check_package() {
            local key="$1"
            local package_name="$2"
            local package_dir="$3"
            local current_version
            local npm_version
            local published
            local out
            local err

            current_version=$(node -p "require('./${package_dir}/package.json').version")
            out=$(mktemp)
            err=$(mktemp)

            if npm view "$package_name@$current_version" version >"$out" 2>"$err"; then
              npm_version=$(tr -d '[:space:]' <"$out")
              published=true
            elif grep -qiE 'E404|404 Not Found|Not found' "$err"; then
              npm_version="unpublished"
              published=false
            else
              echo "Unable to determine whether $package_name@$current_version is published." >&2
              cat "$err" >&2
              echo "Check npm access/network for @vibebrowser/mcp and @vibebrowser/cli." >&2
              rm -f "$out" "$err"
              exit 1
            fi

            rm -f "$out" "$err"

            echo "${key}_name=$package_name" >> "$GITHUB_OUTPUT"
            echo "${key}_dir=$package_dir" >> "$GITHUB_OUTPUT"
            echo "${key}_current=$current_version" >> "$GITHUB_OUTPUT"
            echo "${key}_npm=$npm_version" >> "$GITHUB_OUTPUT"
            echo "${key}_published=$published" >> "$GITHUB_OUTPUT"
            if [ "$published" != "true" ]; then
              echo "${key}_changed=true" >> "$GITHUB_OUTPUT"
              echo "$package_name version $current_version needs publishing (exact version not found on npm)"
            else
              echo "${key}_changed=false" >> "$GITHUB_OUTPUT"
              echo "$package_name version $current_version already published"
            fi
          }

          check_package "root" "@vibebrowser/mcp" "."
          check_package "cli" "@vibebrowser/cli" "packages/cli"
      
      - name: Publish to npm
        id: publish
        if: steps.versions.outputs.root_changed == 'true' || steps.versions.outputs.cli_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          publish_with_oidc() {
            local package_name="$1"
            local package_dir="$2"
            echo "Attempting npm publish for $package_name from $package_dir via OIDC trusted publishing..."
            (cd "$package_dir" && env -u NODE_AUTH_TOKEN npm publish --provenance --access public)
          }

          publish_with_token() {
            local package_name="$1"
            local package_dir="$2"
            echo "Attempting npm publish for $package_name from $package_dir via token fallback..."
            (cd "$package_dir" && NODE_AUTH_TOKEN="$token_value" npm publish --access public)
          }

          token_sources=()
          token_values=()

          add_token_candidate() {
            local candidate="${1:-}"
            local source="$2"
            if [ -z "$candidate" ]; then
              return 0
            fi
            token_sources+=("$source")
            token_values+=("$candidate")
          }

          add_token_candidate "${NODE_AUTH_TOKEN:-}" "NODE_AUTH_TOKEN"
          add_token_candidate "${NPM_TOKEN:-}" "NPM_TOKEN"
          add_token_candidate "${NODE_AUTH_TOKEN_FALLBACK:-}" "NODE_AUTH_TOKEN_FALLBACK"

          echo "Token fallback candidates: ${#token_values[@]} (sources: ${token_sources[*]:-none})"

          publish_package() {
            local key="$1"
            local package_name="$2"
            local package_dir="$3"

            if publish_with_oidc "$package_name" "$package_dir"; then
              echo "${key}_mode=oidc" >> "$GITHUB_OUTPUT"
              return 0
            fi

            echo "OIDC publish failed for $package_name. Attempting token-based publish fallback..."
            if [ ${#token_values[@]} -gt 0 ]; then
              local idx
              for idx in "${!token_values[@]}"; do
                token_value="${token_values[$idx]}"
                token_source="${token_sources[$idx]}"

                if NODE_AUTH_TOKEN="$token_value" npm whoami >/dev/null 2>&1; then
                  echo "Token from $token_source passed npm whoami preflight"
                else
                  echo "Token from $token_source failed npm whoami preflight; attempting publish anyway"
                fi

                echo "Trying token fallback from $token_source for $package_name..."
                if publish_with_token "$package_name" "$package_dir"; then
                  echo "${key}_mode=token:${token_source}" >> "$GITHUB_OUTPUT"
                  return 0
                fi
              done
              echo "Token-based publish failed for $package_name with all configured token sources." >&2
              echo "Ensure NODE_AUTH_TOKEN/NPM_TOKEN is valid and has publish rights for @vibebrowser/mcp and @vibebrowser/cli." >&2
              exit 1
            fi

            echo "No npm auth tokens configured for $package_name." >&2
            echo "Configure npm trusted publishing for this repository/workflow OR set a valid NODE_AUTH_TOKEN/NPM_TOKEN secret for @vibebrowser/mcp and @vibebrowser/cli." >&2
            exit 1
          }

          if [ "${{ steps.versions.outputs.root_changed }}" = "true" ]; then
            publish_package "root" "${{ steps.versions.outputs.root_name }}" "${{ steps.versions.outputs.root_dir }}"
          fi

          if [ "${{ steps.versions.outputs.cli_changed }}" = "true" ]; then
            publish_package "cli" "${{ steps.versions.outputs.cli_name }}" "${{ steps.versions.outputs.cli_dir }}"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN_FALLBACK: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Deprecate broken @vibebrowser/cli@0.3.0
        if: steps.versions.outputs.cli_current == '0.3.1' && steps.publish.outputs.cli_mode != ''
        shell: bash
        run: |
          set -euo pipefail

          expected_message='Broken package: missing runtime file. Use 0.3.1 or later.'
          token_sources=()
          token_values=()

          add_token_candidate() {
            local candidate="${1:-}"
            local source="$2"
            if [ -z "$candidate" ]; then
              return 0
            fi
            token_sources+=("$source")
            token_values+=("$candidate")
          }

          add_token_candidate "${NODE_AUTH_TOKEN:-}" "NODE_AUTH_TOKEN"
          add_token_candidate "${NPM_TOKEN:-}" "NPM_TOKEN"
          add_token_candidate "${NODE_AUTH_TOKEN_FALLBACK:-}" "NODE_AUTH_TOKEN_FALLBACK"

          selected_token=''
          selected_source=''
          if [ ${#token_values[@]} -gt 0 ]; then
            for idx in "${!token_values[@]}"; do
              candidate="${token_values[$idx]}"
              source="${token_sources[$idx]}"
              if NODE_AUTH_TOKEN="$candidate" npm whoami >/dev/null 2>&1; then
                selected_token="$candidate"
                selected_source="$source"
                break
              fi
            done
          fi

          if [ -z "$selected_token" ]; then
            echo "Failed to find a valid npm token for CLI deprecation." >&2
            echo "Checked token sources: ${token_sources[*]:-none}" >&2
            exit 1
          fi

          echo "Applying npm deprecation for @vibebrowser/cli@0.3.0 using token source: $selected_source"
          NODE_AUTH_TOKEN="$selected_token" npm deprecate "@vibebrowser/cli@0.3.0" "$expected_message"

          actual_message="$(NODE_AUTH_TOKEN="$selected_token" npm view @vibebrowser/cli@0.3.0 deprecated 2>/dev/null | tr -d '\r' | sed -e 's/[[:space:]]*$//')"
          if [ "$actual_message" != "$expected_message" ]; then
            echo "Deprecation verification failed for @vibebrowser/cli@0.3.0." >&2
            echo "Expected: $expected_message" >&2
            echo "Actual: ${actual_message:-<empty>}" >&2
            exit 1
          fi

          echo "Deprecation verified for @vibebrowser/cli@0.3.0."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NODE_AUTH_TOKEN_FALLBACK: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Create Git tags
        if: steps.versions.outputs.root_changed == 'true' || steps.versions.outputs.cli_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          create_tag_if_missing() {
            local tag="$1"
            local message="$2"

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists locally, skipping"
              return 0
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists on origin, skipping"
              return 0
            fi

            git tag -a "$tag" -m "$message"
            git push origin "$tag" || echo "Tag $tag push failed or already exists, continuing"
          }

          if [ "${{ steps.versions.outputs.root_changed }}" = "true" ]; then
            create_tag_if_missing "v${{ steps.versions.outputs.root_current }}" "Release v${{ steps.versions.outputs.root_current }}"
          fi

          if [ "${{ steps.versions.outputs.cli_changed }}" = "true" ]; then
            create_tag_if_missing "cli-v${{ steps.versions.outputs.cli_current }}" "Release @vibebrowser/cli v${{ steps.versions.outputs.cli_current }}"
          fi

      - name: Skip publish (version unchanged)
        if: steps.versions.outputs.root_changed == 'false' && steps.versions.outputs.cli_changed == 'false'
        run: echo "@vibebrowser/mcp ${{ steps.versions.outputs.root_current }} and @vibebrowser/cli ${{ steps.versions.outputs.cli_current }} already published, skipping"
